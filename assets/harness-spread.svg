<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1100" height="560" fill="#ffffff" rx="8"/>
  <text x="550" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">Same model. Different harness.</text>
  <text x="550" y="82" text-anchor="middle" font-size="15" fill="#6b7280">Coding-benchmark pass rates when only the harness around the model changes</text>

  <!-- axis -->
  <line x1="220" y1="440" x2="1040" y2="440" stroke="#e5e7eb" stroke-width="1"/>
  <g font-size="12" fill="#9ca3af" text-anchor="middle">
    <text x="220" y="462">0%</text>
    <text x="425" y="462">25%</text>
    <text x="630" y="462">50%</text>
    <text x="835" y="462">75%</text>
    <text x="1040" y="462">100%</text>
  </g>
  <g stroke="#f3f4f6" stroke-width="1">
    <line x1="425" y1="110" x2="425" y2="440"/>
    <line x1="630" y1="110" x2="630" y2="440"/>
    <line x1="835" y1="110" x2="835" y2="440"/>
  </g>

  <!-- row 1: Cursor research, unnamed model 46 -> 80 -->
  <text x="205" y="150" text-anchor="end" font-size="14" font-weight="600" fill="#1f2937">Same model,</text>
  <text x="205" y="167" text-anchor="end" font-size="12" fill="#6b7280">Cursor's benchmarking research</text>
  <line x1="220" y1="155" x2="1040" y2="155" stroke="#f3f4f6" stroke-width="2"/>
  <line x1="597" y1="155" x2="876" y2="155" stroke="#5ac4bf" stroke-width="8" stroke-linecap="round"/>
  <circle cx="597" cy="155" r="8" fill="#0f766e"/>
  <circle cx="876" cy="155" r="8" fill="#0f766e"/>
  <text x="583" y="160" text-anchor="end" font-size="14" font-weight="700" fill="#111827">46%</text>
  <text x="890" y="160" font-size="14" font-weight="700" fill="#111827">80%</text>
  <text x="736" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">+34 pts</text>

  <!-- row 2: GLM-5.2 23 -> 52 -->
  <text x="205" y="230" text-anchor="end" font-size="14" font-weight="600" fill="#1f2937">GLM-5.2,</text>
  <text x="205" y="247" text-anchor="end" font-size="12" fill="#6b7280">SWE-bench Pro</text>
  <line x1="220" y1="235" x2="1040" y2="235" stroke="#f3f4f6" stroke-width="2"/>
  <line x1="409" y1="235" x2="646" y2="235" stroke="#5ac4bf" stroke-width="8" stroke-linecap="round"/>
  <circle cx="409" cy="235" r="8" fill="#0f766e"/>
  <circle cx="646" cy="235" r="8" fill="#0f766e"/>
  <text x="395" y="240" text-anchor="end" font-size="14" font-weight="700" fill="#111827">23%</text>
  <text x="660" y="240" font-size="14" font-weight="700" fill="#111827">52%</text>
  <text x="527" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">+29 pts</text>

  <!-- row 3: Gemma 4 26B 15 -> 36 -->
  <text x="205" y="310" text-anchor="end" font-size="14" font-weight="600" fill="#1f2937">Gemma 4 26B,</text>
  <text x="205" y="327" text-anchor="end" font-size="12" fill="#6b7280">SWE-bench Pro</text>
  <line x1="220" y1="315" x2="1040" y2="315" stroke="#f3f4f6" stroke-width="2"/>
  <line x1="343" y1="315" x2="515" y2="315" stroke="#5ac4bf" stroke-width="8" stroke-linecap="round"/>
  <circle cx="343" cy="315" r="8" fill="#0f766e"/>
  <circle cx="515" cy="315" r="8" fill="#0f766e"/>
  <text x="329" y="320" text-anchor="end" font-size="14" font-weight="700" fill="#111827">15%</text>
  <text x="529" y="320" font-size="14" font-weight="700" fill="#111827">36%</text>
  <text x="429" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">+21 pts</text>

  <!-- row 4: Opus 4.5 73.2 -> 77.6 -->
  <text x="205" y="390" text-anchor="end" font-size="14" font-weight="600" fill="#1f2937">Claude Opus 4.5,</text>
  <text x="205" y="407" text-anchor="end" font-size="12" fill="#6b7280">SWE-bench Verified</text>
  <line x1="220" y1="395" x2="1040" y2="395" stroke="#f3f4f6" stroke-width="2"/>
  <line x1="820" y1="395" x2="856" y2="395" stroke="#5ac4bf" stroke-width="8" stroke-linecap="round"/>
  <circle cx="820" cy="395" r="8" fill="#0f766e"/>
  <circle cx="856" cy="395" r="8" fill="#0f766e"/>
  <text x="806" y="400" text-anchor="end" font-size="14" font-weight="700" fill="#111827">73.2%</text>
  <text x="870" y="400" font-size="14" font-weight="700" fill="#111827">77.6%</text>
  <text x="838" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">+4.4 even at the frontier</text>

  <!-- takeaway -->
  <text x="550" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Harness rankings barely transfer between models (rank correlation about -0.05):</text>
  <text x="550" y="521" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">there is no best harness, only best pairings.</text>

  <text x="1040" y="548" text-anchor="end" font-size="11" fill="#9ca3af">Cursor research via MindStudio · @joelniklaus SWE-bench Pro analysis · tensorfeed.ai · CC BY-SA 4.0 · github.com/RyanAlberts/best-of-Agent-Harnesses</text>
</svg>
